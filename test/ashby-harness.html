<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ashby harness</title>
    <style>
      body { margin:0; padding:24px; background:#0b0b10; color:#e8e8ee; font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
      .page { max-width:620px; } label, legend { display:block; font-size:11px; color:#8a8a9c; }
      fieldset { border:0; padding:0; margin:0 0 10px; }
      input[type=text], input[type=email], input[type=tel], textarea { display:block; width:100%; box-sizing:border-box; margin:3px 0 8px; padding:6px 8px;
        border-radius:7px; background:#0f0f15; border:1px solid #2c2c38; color:#e8e8ee; }
      #verdict.pass { background:#12321f; } #verdict.fail { background:#3a1616; }
      #verdict { margin:10px 0; padding:11px 13px; border-radius:8px; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Ashby harness</h1>
    <p>Reading the form: synthetic markup structured like the Ashby application page. Synthetic data only.</p>
    <div id="verdict">running…</div>
    <pre id="out"></pre>
    <div id="root" class="page">
      <div class="ashby-application-form-container">
        <div class="ashby-application-form-autofill-uploader"><input type="file" id="autofill-file"></div>
        <div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label class="_h _required_x1 _l ashby-application-form-question-title" for="_systemfield_name">Name</label><input type="text" id="_systemfield_name" name="_systemfield_name" required class="ashby-application-form-input-text" value="Testy McTestface"></div>
        <div class="ashby-application-form-field-entry" data-field-path="_systemfield_email"><label class="_h _required_x1 _l ashby-application-form-question-title" for="_systemfield_email">Email</label><input type="email" id="_systemfield_email" name="_systemfield_email" required class="ashby-application-form-input-text" value="testy@example.com"></div>
        <div class="ashby-application-form-field-entry" data-field-path="phone-1"><label class="_h _required_x1 _l ashby-application-form-question-title" for="phone-1">Phone</label><input type="tel" id="phone-1" name="phone-1" required class="ashby-application-form-input-text" value=""><div class="ashby-application-form-texting-consent-description"><p>Check Yes or No to receive synthetic texts.</p><div><label><input type="radio" name="communicationConsent" value="given"><div><p><strong>Yes</strong> - I consent to receiving text messages</p></div></label><label><input type="radio" name="communicationConsent" value="notGiven" checked><div><p><strong>No</strong> - I do not consent to receiving text messages</p></div></label></div></div></div>
        <div class="ashby-application-form-field-entry" data-field-path="_systemfield_location"><label class="_h _required_x1 _l ashby-application-form-question-title" for="_systemfield_location">Location</label><div><input class="ashby-application-form-input-autocomplete" placeholder="Start typing..." aria-autocomplete="list" aria-expanded="false" aria-haspopup="listbox" role="combobox" value=""><button type="button">v</button></div><ul role="listbox" id="fake-listbox"><li role="option">Testville, ZZ</li></ul></div>
        <div class="ashby-application-form-field-entry" data-field-path="linkedin-1"><label class="_h _l ashby-application-form-question-title" for="linkedin-1">LinkedIn</label><input type="text" id="linkedin-1" name="linkedin-1" class="ashby-application-form-input-text" value=""></div>
        <div class="ashby-application-form-field-entry" data-field-path="github-1"><label class="_h _l ashby-application-form-question-title" for="github-1">GitHub</label><input type="text" id="github-1" name="github-1" class="ashby-application-form-input-text" value=""></div>
        <div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume"><label class="_h _required_x1 _l ashby-application-form-question-title" for="_systemfield_resume">Resume</label><div class="ashby-application-form-input-file"><input type="file" id="_systemfield_resume" required><div class="ashby-application-form-input-file-item"><p class="ashby-application-form-input-file-item-name"><svg></svg><span>testy-resume.pdf</span></p></div></div></div>
        <div class="ashby-application-form-field-entry" data-field-path="sponsor-1"><label class="_h _required_x1 _l ashby-application-form-question-title" for="sponsor-1">Will you now or in the future require sponsorship?</label><div class="ashby-application-form-input-yesno"><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="true" data-option="no">No</button><input type="checkbox" tabindex="-1" name="sponsor-1"></div></div>
        <div class="ashby-application-form-field-entry" data-field-path="office-1"><label class="_h _required_x1 _l ashby-application-form-question-title" for="office-1">Are you able to work in office 3 days a week?</label><div class="ashby-application-form-input-yesno"><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button type="button" class="ashby-application-form-input-yesno-option" aria-pressed="true" data-option="no">No</button><input type="checkbox" tabindex="-1" name="office-1"></div></div>
        <div data-field-path="hear-1"><fieldset class="ashby-application-form-input-radio-group"><label class="_h _required_x1 _l ashby-application-form-question-title" for="hear-1">How did you hear about us?</label><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1_hear-1-labeled-radio-0" name="form1_hear-1"></span><label for="form1_hear-1-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">Job board</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1_hear-1-labeled-radio-1" name="form1_hear-1" checked></span><label for="form1_hear-1-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">Careers page</label></div></fieldset></div>
        <div data-field-path="arb-1"><fieldset class="ashby-application-form-input-checkbox-group"><label class="_h _required_x1 _l ashby-application-form-question-title" for="arb-1">Arbitration</label><div class="ashby-application-form-input-checkbox-group-option"><span><input type="checkbox" id="form1_arb-1-labeled-checkbox-0" name="I acknowledge the Synthetic Arbitration Agreement." checked></span><label for="form1_arb-1-labeled-checkbox-0" class="ashby-application-form-input-checkbox-group-option-label">I acknowledge the Synthetic Arbitration Agreement.</label></div></fieldset></div>
        <div class="ashby-application-form-field-entry" data-field-path="start-date"><label class="_h _required_x1 _l ashby-application-form-question-title" for="start-date">When could you start?</label><div class="react-datepicker-wrapper"><div class="react-datepicker__input-container"><input type="text" placeholder="Pick date..." class="ashby-application-form-input-date" required value="01/18/2027"></div></div></div>
        <div class="ashby-application-form-field-entry" data-field-path="company-1"><label class="_h _required_x1 _l ashby-application-form-question-title" for="company-1">Have you worked at Initech Synthetic before?</label><input type="text" id="company-1" name="company-1" required class="ashby-application-form-input-text" value=""></div>
        <textarea name="g-recaptcha-response" class="g-recaptcha-response"></textarea><div data-field-path="recaptcha-wrap"><textarea id="g-recaptcha-response-100000" name="g-recaptcha-response" class="g-recaptcha-response"></textarea></div>
      </div>
      <div class="ashby-survey-form-container"><div class="ashby-application-form-container">
        <div data-field-path="_systemfield_eeoc_gender"><fieldset class="ashby-application-form-input-radio-group"><label class="_h _l ashby-application-form-question-title" for="_systemfield_eeoc_gender">Gender</label><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_gender-labeled-radio-0" name="form1__systemfield_eeoc_gender"></span><label for="form1__systemfield_eeoc_gender-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">Male</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_gender-labeled-radio-1" name="form1__systemfield_eeoc_gender"></span><label for="form1__systemfield_eeoc_gender-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">Female</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_gender-labeled-radio-2" name="form1__systemfield_eeoc_gender"></span><label for="form1__systemfield_eeoc_gender-labeled-radio-2" class="ashby-application-form-input-radio-group-option-label">Decline to self-identify</label></div></fieldset></div>
        <div data-field-path="_systemfield_eeoc_race"><fieldset class="ashby-application-form-input-radio-group"><label class="_h _l ashby-application-form-question-title" for="_systemfield_eeoc_race">Race</label><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_race-labeled-radio-0" name="form1__systemfield_eeoc_race"></span><label for="form1__systemfield_eeoc_race-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">Group A</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_race-labeled-radio-1" name="form1__systemfield_eeoc_race"></span><label for="form1__systemfield_eeoc_race-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">Group B</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_race-labeled-radio-2" name="form1__systemfield_eeoc_race"></span><label for="form1__systemfield_eeoc_race-labeled-radio-2" class="ashby-application-form-input-radio-group-option-label">Decline to self-identify</label></div></fieldset></div>
        <div data-field-path="_systemfield_eeoc_veteran_status"><fieldset class="ashby-application-form-input-radio-group"><label class="_h _l ashby-application-form-question-title" for="_systemfield_eeoc_veteran_status">Veteran status</label><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_veteran_status-labeled-radio-0" name="form1__systemfield_eeoc_veteran_status"></span><label for="form1__systemfield_eeoc_veteran_status-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">I am a veteran</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1__systemfield_eeoc_veteran_status-labeled-radio-1" name="form1__systemfield_eeoc_veteran_status" checked></span><label for="form1__systemfield_eeoc_veteran_status-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">I am not a veteran</label></div></fieldset></div>
        <div data-field-path="ethnicity-1"><fieldset class="ashby-application-form-input-checkbox-group"><label class="_h _l ashby-application-form-question-title" for="ethnicity-1">Which of these describe you?</label><div class="ashby-application-form-input-checkbox-group-option"><span><input type="checkbox" id="form1_ethnicity-1-labeled-checkbox-0" name="Option A" checked></span><label for="form1_ethnicity-1-labeled-checkbox-0" class="ashby-application-form-input-checkbox-group-option-label">Option A</label></div><div class="ashby-application-form-input-checkbox-group-option"><span><input type="checkbox" id="form1_ethnicity-1-labeled-checkbox-1" name="Option B"></span><label for="form1_ethnicity-1-labeled-checkbox-1" class="ashby-application-form-input-checkbox-group-option-label">Option B</label></div><div class="ashby-application-form-input-checkbox-group-option"><span><input type="checkbox" id="form1_ethnicity-1-labeled-checkbox-2" name="Option C" checked></span><label for="form1_ethnicity-1-labeled-checkbox-2" class="ashby-application-form-input-checkbox-group-option-label">Option C</label></div></fieldset></div>
        <div data-field-path="age-1"><fieldset class="ashby-application-form-input-radio-group"><label class="_h _l ashby-application-form-question-title" for="age-1">What is your age range?</label><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1_age-1-labeled-radio-0" name="form1_age-1"></span><label for="form1_age-1-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">18-24</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1_age-1-labeled-radio-1" name="form1_age-1"></span><label for="form1_age-1-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">25-34</label></div><div class="ashby-application-form-input-radio-group-option"><span><input type="radio" id="form1_age-1-labeled-radio-2" name="form1_age-1"></span><label for="form1_age-1-labeled-radio-2" class="ashby-application-form-input-radio-group-option-label">35-44</label></div></fieldset></div>
      </div></div>
    </div>

    <script src="../content/00-namespace.js"></script>
    <script src="../content/react-set.js"></script>
    <script src="../content/match.js"></script>
    <script src="../content/questions.js"></script>
    <script src="../content/filler.js"></script>
    <script src="../sites/ashby.js"></script>

    <script>
      const lines = [];
      const check = (label, actual, expected) => {
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        lines.push(`${ok ? '  ok' : ' FAIL'}  ${label}${ok ? '' : `  got ${JSON.stringify(actual)} want ${JSON.stringify(expected)}`}`);
      };
      try {
        const form = AF.sites.ashby.form;
        const fields = form.readFields();
        const by = (id) => fields.find((f) => f.fieldId === id);
        const shape = (id) => { const f = by(id); return f && [f.widget, f.question, f.required]; };
        const val = (id) => { const f = by(id); return f ? form.currentValue(f) : undefined; };

        check('exposes the four functions', ['readFields', 'currentValue', 'fillPage', 'readAnswers'].map((k) => typeof form[k]), ['function', 'function', 'function', 'function']);
        check('page order', fields.map((f) => f.fieldId), ['_systemfield_name', '_systemfield_email', 'phone-1', 'communicationConsent', '_systemfield_location',
          'linkedin-1', 'github-1', '_systemfield_resume', 'sponsor-1', 'office-1', 'hear-1', 'arb-1', 'start-date', 'company-1',
          '_systemfield_eeoc_gender', '_systemfield_eeoc_race', '_systemfield_eeoc_veteran_status', 'ethnicity-1', 'age-1']);
        check('name', shape('_systemfield_name'), ['text', 'Name', true]);
        check('email', shape('_systemfield_email'), ['text', 'Email', true]);
        check('phone', shape('phone-1'), ['text', 'Phone', true]);
        check('consent radios', shape('communicationConsent'), ['choice', 'I consent to receiving text messages', false]);
        check('consent value', val('communicationConsent'), 'No - I do not consent to receiving text messages');
        check('location', shape('_systemfield_location'), ['location', 'Location', true]);
        check('linkedin', shape('linkedin-1'), ['text', 'LinkedIn', false]);
        check('github', shape('github-1'), ['text', 'GitHub', false]);
        check('resume', shape('_systemfield_resume'), ['file', 'Resume', true]);
        check('resume file name', val('_systemfield_resume'), 'testy-resume.pdf');
        check('sponsorship yes/no', shape('sponsor-1'), ['yesno', 'Will you now or in the future require sponsorship?', true]);
        check('yes/no value', val('sponsor-1'), 'No');
        check('office yes/no', shape('office-1'), ['yesno', 'Are you able to work in office 3 days a week?', true]);
        check('hear about us', shape('hear-1'), ['choice', 'How did you hear about us?', true]);
        check('radio value', val('hear-1'), 'Careers page');
        check('arbitration checkbox', shape('arb-1'), ['checkbox', 'Arbitration I acknowledge the Synthetic Arbitration Agreement.', true]);
        check('checkbox value', val('arb-1'), 'I acknowledge the Synthetic Arbitration Agreement.');
        check('start date', shape('start-date'), ['date', 'When could you start?', true]);
        check('date value', val('start-date'), '01/18/2027');
        check('company text', shape('company-1'), ['text', 'Have you worked at Initech Synthetic before?', true]);
        check('empty text value', val('company-1'), '');
        check('text value', val('_systemfield_name'), 'Testy McTestface');
        check('survey gender', shape('_systemfield_eeoc_gender'), ['choice', 'Gender', false]);
        check('survey race', shape('_systemfield_eeoc_race'), ['choice', 'Race', false]);
        check('survey veteran', shape('_systemfield_eeoc_veteran_status'), ['choice', 'Veteran status', false]);
        check('veteran value', val('_systemfield_eeoc_veteran_status'), 'I am not a veteran');
        check('ethnicity multi-checkbox is a choice', shape('ethnicity-1'), ['choice', 'Which of these describe you?', false]);
        check('multi-checkbox value', val('ethnicity-1'), 'Option A, Option C');
        check('age range', shape('age-1'), ['choice', 'What is your age range?', false]);
        check('unanswered radio value', val('age-1'), '');
        check('every wrap is an element in the page', fields.every((f) => f.wrap instanceof Element && document.contains(f.wrap)), true);
        check('autofill uploader absent', fields.some((f) => f.wrap.closest('.ashby-application-form-autofill-uploader') || f.wrap.querySelector('#autofill-file')), false);
        check('recaptcha textarea absent', fields.some((f) => f.wrap.querySelector('textarea[name="g-recaptcha-response"]')), false);
        check('recaptcha-only wrap yields no field', fields.some((f) => f.fieldId === 'recaptcha-wrap'), false);
      } catch (err) {
        lines.push(` FAIL  threw: ${err?.message ?? err}`);
      }

      const passed = lines.filter((l) => l.startsWith('  ok')).length;
      const failed = lines.filter((l) => l.startsWith(' FAIL')).length;
      document.getElementById('out').textContent = lines.join('\n');
      const verdict = document.getElementById('verdict');
      verdict.className = failed ? 'fail' : 'pass';
      verdict.textContent = `${passed} passed, ${failed} failed`;
      window.__lines = lines;
    </script>
  </body>
</html>
